name: SkysongWardrobe
version: '${version}'
main: org.skysongdev.skysongwardrobe.SkysongWardrobe
api-version: '1.21.11'
authors: [Ghiojo]
description: Wear SkysongItems items in a wardrobe that draws their layers onto your skin.

# Every item tag the wardrobe reads lives in SkysongItems, so it must enable first.
depend: [Skysong_Items]
# Optional: worn items count towards stats when SkysongStats is installed,
# WorldGuard regions decide who may place, use and break mannequins, and
# Citizens player NPCs get a wardrobe.
softdepend: [SkysongStats, WorldGuard, Citizens]
# Downloaded by Paper at start: the connection pool for storage.type sqlite or mysql.
libraries:
  - com.zaxxer:HikariCP:6.2.1
