# Every text players see, in MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# <prefix> is replaced by the prefix below. Run /sw reload after editing.

prefix: "<dark_gray>[<gold>Wardrobe</gold>]</dark_gray>"

# The Agree/Decline screen /sw upload shows before downloading.
# Placeholders: <id>, <name>, <link>
upload:
  prompt:
    title: "<gold>Upload a skin"
    body: "<gray>You are adding <white><name></white> (<white><id></white>) to your gallery from:<newline><white><link></white><newline><newline>Only upload skins you made or may use."
    agree: "<green>Agree"
    decline: "<red>Decline"
  # Placeholders in every upload message: <id>, <name>, <link>
  invalid-id: "<prefix> <red>Ids are 1 to 32 letters, digits or underscores, so <white><id></white> can't be used."
  invalid-link: "<prefix> <red><white><link></white> is not an http or https link."
  id-taken: "<prefix> <red>Your gallery already has <white><id></white>. Pick another id, or delete that one first."
  declined: "<prefix> <gray>Upload of <white><id></white> cancelled."
  downloading: "<prefix> <gray>Downloading <white><id></white>..."
  saved: "<prefix> <green>Saved <white><name></white> as <white><id></white> in your gallery."
  error: "<prefix> <red>Could not save <white><id></white>. Please tell staff."
  failed:
    invalid-link: "<prefix> <red><white><link></white> is not an http or https link."
    private-address: "<prefix> <red><white><link></white> points to a private address. Use a public link to the image."
    unreachable: "<prefix> <red>Could not download <white><link></white>. Check that it is a direct link to the image."
    too-large: "<prefix> <red>That file is too large to be a skin."
    not-png: "<prefix> <red>That link is not a PNG image. Use a direct link to the .png file."
    wrong-size: "<prefix> <red>Skins must be 64x64 pixels."

# Placeholders: <id>, and <name> and <icon> once the entry is found
edit:
  not-found: "<prefix> <red>Your gallery has no <white><id></white>."
  invalid-icon: "<prefix> <red><white><icon></white> is not an item."
  name-done: "<prefix> <green><white><id></white> is now called <white><name></white>."
  icon-done: "<prefix> <green><white><id></white> now shows as <white><icon></white>."
  link-done: "<prefix> <green>Replaced the image of <white><id></white>. The old one is kept in the deleted folder."
  error: "<prefix> <red>Could not edit <white><id></white>. Please tell staff."

# Placeholders: <id>
delete:
  not-found: "<prefix> <red>Your gallery has no <white><id></white>."
  done: "<prefix> <green>Deleted <white><id></white> from your gallery. Items that already use it keep showing it."
  error: "<prefix> <red>Could not delete <white><id></white>. Please tell staff."

gallery:
  # Under each entry's name in the gallery menu. Placeholders: <id>
  entry-lore: "<dark_gray><id>"
  # Placeholders: <player>
  unknown-player: "<prefix> <red>No player called <white><player></white> has played here."

wardrobe:
  refused:
    no-type: "<prefix> <red>That item can't be worn in the wardrobe."
    not-accepted: "<prefix> <red>That item doesn't go in this slot."
    slot-full: "<prefix> <red>Take the item in this slot out first."
    no-free-slot: "<prefix> <red>There is no free slot for that item."
  inventory-full: "<prefix> <red>Your inventory is full."
  save-error: "<prefix> <red>Could not save the wardrobe. Please tell staff."
  closed: "<prefix> <red>The wardrobe is closed until staff fix wardrobe.yml."
  # Placeholders: <player>
  unknown-player: "<prefix> <red>No player called <white><player></white> has played here."

# Placeholders: <player> (the gallery's owner) and <id>
apply:
  done: "<prefix> <green>Applied <white><player>:<id></white> to the item in your hand."
  not-found: "<prefix> <red><white><player></white>'s gallery has no <white><id></white>."
  unknown-player: "<prefix> <red>No player called <white><player></white> has played here."
  no-permission-other: "<prefix> <red>You can only apply skins from your own gallery."
  unknown-layer: "<prefix> <red>The layer must be regular or dyed."
  not-a-skysong-item: "<prefix> <red>Hold a SkysongItems item in your main hand."

unapply:
  done: "<prefix> <green>Removed that layer from the item in your hand."
  nothing: "<prefix> <red>The item in your hand has no such layer."

reload:
  done: "<prefix> <green>Reloaded config.yml, messages.yml and wardrobe.yml."
  layout-broken: "<prefix> <red>Reloaded, but wardrobe.yml has errors, so the wardrobe stays closed. The console lists them."

render:
  # Sent when a new outfit waits for MineSkin to sign it.
  queued: "<prefix> <gray>Your new look is being prepared and will appear shortly."
