# SkysongWardrobe settings. Run /sw reload after editing.

# Log silent failures, such as a worn item whose skin file is missing.
verbose: false

gallery:
  # Holding ANY one of these permissions grants the skin gallery,
  # so permissions from other plugins (such as SkysongStats) can be listed here.
  permissions:
    - skysongwardrobe.gallery
  # Skin files bigger than this are refused.
  max-download-kb: 512
  download-timeout-seconds: 10

apply:
  # Holding ANY one of these permissions grants /sw apply and /sw unapply.
  permissions:
    - skysongwardrobe.apply

render:
  # The shortest time between two MineSkin uploads for one player.
  upload-cooldown-seconds: 30

mineskin:
  # Needed to render skins. See the README for how to get one.
  api-key: ""
  # Who may find the skins uploaded to MineSkin: unlisted or private. Both keep them out of
  # MineSkin's gallery and search. Private also hides them from everyone with the link, but
  # not every MineSkin plan allows it. Public is never used.
  visibility: unlisted

mannequins:
  # Holding ANY one of these lets a player place mannequins, and open and break their own.
  # The .other variant (such as skysongwardrobe.mannequin.other) reaches everyone's.
  permissions:
    - skysongwardrobe.mannequin
  # The most mannequins one player may have placed. 0 means no limit.
  max-per-player: 0
  # The most mannequins one chunk may hold. 0 means no limit.
  max-per-chunk: 15

npcs:
  # Holding ANY one of these lets a player dress the Citizens NPCs they own with /sw npc.
  # The .other variant (such as skysongwardrobe.npc.other) reaches every NPC. Needs Citizens.
  permissions:
    - skysongwardrobe.npc

storage:
  # Where wardrobes, mannequins, NPCs and signed skins are kept: yaml, sqlite or mysql.
  # yaml is plain files. sqlite is one local database file, with nothing to set up.
  # mysql also works with MariaDB. Skin galleries always stay as files in skins/.
  # Read only at start: restart the server after changing it. Changing it does not move
  # any data; see the README for how to import the files into a database.
  type: yaml
  sqlite:
    # The database file, inside the plugin folder.
    file: data.db
  mysql:
    host: "localhost"
    port: "3306"
    user: "root"
    password: ""
    database_name: "skysong"
    # Put before every table name, so these tables never clash with another plugin's
    # (SkysongStats uses ss_). Letters, digits and _ only.
    table-prefix: "sw_"
    # The most connections open at once.
    pool-size: 4
