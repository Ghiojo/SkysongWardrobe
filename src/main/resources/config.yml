# SkysongWardrobe settings. Run /sw reload after editing.

# Log silent failures, such as a worn item whose skin file is missing.
verbose: false

gallery:
  # Holding ANY one of these permissions grants the skin gallery,
  # so permissions from other plugins (such as SkysongStats) can be listed here.
  permissions:
    - skysongwardrobe.gallery
  # Skin files bigger than this are refused.
  max-download-kb: 512
  download-timeout-seconds: 10

apply:
  # Holding ANY one of these permissions grants /sw apply and /sw unapply.
  permissions:
    - skysongwardrobe.apply

render:
  # The shortest time between two MineSkin uploads for one player.
  upload-cooldown-seconds: 30

mineskin:
  # Needed to render skins. See the README for how to get one.
  api-key: ""
