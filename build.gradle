plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
}

group = 'org.skysongdev'
version = '1.0.0'

repositories {
    // JitPack only serves the SkysongItems API, so Gradle never asks it for anything else
    // and never asks the other repositories for the API.
    exclusiveContent {
        forRepository {
            maven {
                name = 'jitpack'
                url = 'https://jitpack.io'
            }
        }
        filter {
            includeModule 'com.github.Ghiojo', 'Skysong-Special-Items'
        }
    }
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    // The SkysongItems API, as JitPack publishes it from the SkysongItems git tag. It ships
    // inside the SkysongItems jar on the server, so it is never shaded.
    compileOnly 'com.github.Ghiojo:Skysong-Special-Items:1.0.1'

    // Tests run on JUnit 6 and MockBukkit 4.116.3, the same versions SkysongItems uses.
    // That MockBukkit release mocks Paper 1.21.11, the API this plugin compiles against.
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'com.github.Ghiojo:Skysong-Special-Items:1.0.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks {
    runServer {
        // Starts a local Paper server with the plugin for manual testing: ./gradlew runServer
        minecraftVersion('1.21.11')
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
