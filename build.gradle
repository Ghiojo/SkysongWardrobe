plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    // Bundles the MineSkin client into the plugin jar, which Paper cannot download for us.
    id 'com.gradleup.shadow' version '8.3.5'
}

// The api module is configured first so its classes can be bundled into the plugin jar.
evaluationDependsOn(':api')

group = 'org.skysongdev'
version = '1.0.0'

repositories {
    // JitPack only serves the SkysongItems and SkysongStats APIs, so Gradle never asks it for anything else
    // and never asks the other repositories for the API.
    exclusiveContent {
        forRepository {
            maven {
                name = 'jitpack'
                url = 'https://jitpack.io'
            }
        }
        filter {
            includeModule 'com.github.Ghiojo', 'Skysong-Special-Items'
            includeModule 'com.github.Ghiojo', 'SkysongStats'
        }
    }
    // The MineSkin repository only serves the official MineSkin client.
    exclusiveContent {
        forRepository {
            maven {
                name = 'mineskin'
                url = 'https://repo.inventivetalent.org/repository/public/'
            }
        }
        filter {
            includeGroup 'org.mineskin'
        }
    }
    // The Citizens repository only serves Citizens, for the optional NPC wardrobes.
    exclusiveContent {
        forRepository {
            maven {
                name = 'citizens'
                url = 'https://maven.citizensnpcs.co/repo'
            }
        }
        filter {
            includeGroup 'net.citizensnpcs'
        }
    }
    // EngineHub serves WorldGuard and WorldEdit, for the optional mannequin region flags.
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
        content {
            includeGroupByRegex 'com\\.sk89q.*'
        }
    }
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // The public API (api/). shadowJar bundles its classes into the plugin jar, unrelocated,
    // so the server has exactly one copy; plugins that use it compile against it with
    // compileOnly and never shade it.
    implementation project(':api')
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    // The SkysongItems API, as JitPack publishes it from the SkysongItems git tag. It ships
    // inside the SkysongItems jar on the server, so it is never shaded.
    compileOnly 'com.github.Ghiojo:Skysong-Special-Items:1.0.1'
    // The SkysongStats API, for the optional item source. No release has the ItemSources API
    // yet, so this is a SkysongStats master commit that has it; swap it for the tag once
    // one is published. Ships inside the SkysongStats jar, so it is never shaded.
    compileOnly 'com.github.Ghiojo:SkysongStats:22ceedb98f'
    // WorldGuard is optional: its flags decide who may place, use and break mannequins in a
    // region. 7.0.17 is the last release built for Java 21; it ships on the server, so it is never shaded.
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.17') {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
        exclude group: 'io.papermc.paper'
    }
    // Citizens is optional: with it, player NPCs get a wardrobe. 2.0.43 is the last Citizens
    // built for 1.21.11; citizens-main carries the API too, and its own dependencies all ship
    // inside the Citizens jar, so none are pulled in. It ships on the server, so it is never shaded.
    compileOnly('net.citizensnpcs:citizens-main:2.0.43-SNAPSHOT') {
        transitive = false
    }
    testImplementation('net.citizensnpcs:citizens-main:2.0.43-SNAPSHOT') {
        transitive = false
    }
    // The official MineSkin client signs rendered skins. Paper already ships Gson and Guava,
    // so only the client itself is bundled.
    implementation('org.mineskin:java-client:3.2.6') {
        exclude group: 'com.google.code.gson'
        exclude group: 'com.google.guava'
    }
    implementation('org.mineskin:java-client-java11:3.2.6') {
        transitive = false
    }
    // HikariCP pools the database connections when storage.type is sqlite or mysql. Paper
    // downloads it at start (plugin.yml libraries:), as for SkysongStats, so it is never shaded.
    // The MySQL and SQLite drivers already ship inside Paper.
    compileOnly 'com.zaxxer:HikariCP:6.2.1'
    testImplementation 'com.zaxxer:HikariCP:6.2.1'
    // The SQL is tested on both real databases it runs on: SQLite, and H2 in MySQL mode.
    testImplementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    testImplementation 'com.h2database:h2:2.3.232'

    // Tests run on JUnit 6 and MockBukkit 4.116.3, the same versions SkysongItems uses.
    // That MockBukkit release mocks Paper 1.21.11, the API this plugin compiles against.
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'com.github.Ghiojo:Skysong-Special-Items:1.0.1'
    testImplementation 'com.github.Ghiojo:SkysongStats:22ceedb98f'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

test {
    useJUnitPlatform()
    testLogging {
        // Skipped shows tests MockBukkit can't run (UnimplementedOperationException), so none hide.
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks {
    runServer {
        // Starts a local Paper server with the plugin for manual testing: ./gradlew runServer
        minecraftVersion('1.21.11')
    }
}

shadowJar {
    // The plain jar name, so the jar to install is the only one in build/libs.
    archiveClassifier.set('')
    // Moved into this plugin's package so it never clashes with another plugin's copy.
    relocate 'org.mineskin', 'org.skysongdev.skysongwardrobe.lib.mineskin'
}

jar {
    // shadowJar replaces the plain jar.
    enabled = false
}

tasks.named('assemble') {
    dependsOn shadowJar
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
